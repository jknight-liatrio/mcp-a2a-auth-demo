    namespace: spire
    chart: spiffe/spire-crds
    version: 0.5.0
    values:
      - spire-values.yaml
  - name: spire
    namespace: spire
    chart: spiffe/spire
    version: 0.26.0
    values:
      - spire-values.yaml
