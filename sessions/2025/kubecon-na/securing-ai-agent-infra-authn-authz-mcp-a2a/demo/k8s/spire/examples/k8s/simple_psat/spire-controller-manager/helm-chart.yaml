apiVersion: v1
kind: Pod
metadata:
  name: "spire-spiffe-oidc-discovery-provider-test-keys"
  namespace: spire
  labels:
    helm.sh/chart: spiffe-oidc-discovery-provider-0.1.0
    app.kubernetes.io/name: spiffe-oidc-discovery-provider
    app.kubernetes.io/instance: spire
    app.kubernetes.io/version: "1.12.4"
    app.kubernetes.io/managed-by: Helm
    release: spire
    release-namespace: spire
    component: test-keys
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    {}
  serviceAccountName: spire-spiffe-oidc-discovery-provider
  initContainers:
    - name: static-busybox
      image: "busybox:1.37.0-uclibc"
      command:
        - sh
        - -c
        - |
          cp /bin/busybox /data/busybox
          chmod +x /data/busybox
      securityContext:
        {}
      volumeMounts:
        - name: data-volume
          mountPath: /data
    - name: install-step
      image: "docker.io/smallstep/step-cli:0.28.6"
      workingDir: /data
      command:
        - sh
        - -c
        - |
          cp /usr/local/bin/step /data/step
      securityContext:
        {}
      volumeMounts:
        - name: data-volume
          mountPath: /data
    - name: gettoken
      image: "ghcr.io/spiffe/spire-agent:1.12.4"
      command:
        - /data/busybox
        - sh
        - -c
        - |
          while true; do
            /opt/spire/bin/spire-agent api fetch jwt -audience foo -format json -socketPath /spire-agent/spire-agent.sock -timeout 5s > /data/token.svid
            [ $? -eq 0 ] && break
            sleep 1
          done
      securityContext:
        {}
      volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: spire-api
          mountPath: /spire-agent
          readOnly: true
  containers:
    - name: verify-keys
      image: "cgr.dev/chainguard/min-toolkit-debug:latest@sha256:3dd03ca4056a6c8024ed1e5dc0999aa836c0c28777dcc3b85bd1d9d853e1ed38"
      command:
        - bash
      workingDir: /data
      env:
      - name: TMPDIR
        value: /data
      args:
        - -cx
        - |
          URL=https://spire-spiffe-oidc-discovery-provider.spire.svc.cluster.local:443

          cat /data/token.svid
          JWT=$(cat /data/token.svid | jq -r '.[] | select(.svids) | .svids[0].svid' | xargs)
          KID=$(echo $JWT | base64 -d 2>/dev/null | jq -r '.kid')
          # Retrieve public key from JWK set, match kid from JWT to locate the correct one
          curl -k -s --fail-with-body "${URL}"/keys | jq '.keys[] | select(.kid == "'${KID}'")' > public.pem
          # Verify JWT with public pem
          echo $JWT | /data/step crypto jwt verify --key=public.pem --alg=RS256 --subtle
      securityContext:
        {}
      volumeMounts:
      - mountPath: /data
